services:
  # 後端服務
  - type: web
    name: eventfinder-backend
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx512m"
    healthCheckPath: /health
    
