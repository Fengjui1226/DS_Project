# ==================== 生产环境配置 ====================
# Server Configuration
server.port=8080
server.threads=20
server.shutdownTimeout=60

# CORS Configuration
cors.origin=*
cors.methods=GET, POST, OPTIONS
cors.headers=Content-Type, Authorization

# Rate Limiting
rateLimit.requests=100
rateLimit.windowSeconds=60

# Session Configuration
session.ttlSeconds=1800

# Cache Configuration
cache.maxSize=1000
cache.ttlMinutes=30

# Logging
log.level=INFO
log.file=logs/app.log

# Security
security.enableHttps=false
security.apiKey.enabled=false
