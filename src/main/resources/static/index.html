<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣活動搜尋引擎</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .result h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .result a {
            color: #007bff;
            text-decoration: none;
        }
        .result a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>搜尋台灣的活動</h1>
        <input type="text" id="searchQuery" placeholder="搜尋活動、展覽、音樂會..." onkeyup="searchActivities()">
        <div id="results"></div>
    </div>

    <script>
        function searchActivities() {
            let query = document.getElementById('searchQuery').value;
            
            if (query.length < 3) {
                document.getElementById('results').innerHTML = ''; // 如果輸入字數少於3個，清空結果
                return;
            }

            // 使用AJAX發送請求
            fetch(`/search?query=${query}`)
                .then(response => response.json())
                .then(data => {
                    let resultsContainer = document.getElementById('results');
                    resultsContainer.innerHTML = ''; // 清空舊結果

                    if (data.length === 0) {
                        resultsContainer.innerHTML = '<p>未找到任何結果。</p>';
                        return;
                    }

                    data.forEach(page => {
                        let resultDiv = document.createElement('div');
                        resultDiv.classList.add('result');
                        resultDiv.innerHTML = `
                            <h3><a href="${page.url}" target="_blank">${page.title}</a></h3>
                            <p>城市: ${page.city}</p>
                            <p>日期: ${page.eventDate}</p>
                        `;
                        resultsContainer.appendChild(resultDiv);
                    });
                })
                .catch(error => {
                    console.error('Error fetching search results:', error);
                });
        }
    </script>

</body>
</html>
