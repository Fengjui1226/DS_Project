<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventFinder 台灣活動搜尋</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans TC',sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;overflow-x:hidden}
    .bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1}
    .bg::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 70%,rgba(255,107,107,0.08) 0%,transparent 50%),radial-gradient(circle at 70% 30%,rgba(78,205,196,0.08) 0%,transparent 50%)}
    .container{max-width:700px;width:90%;margin:0 auto;padding:60px 0;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
    .brand{text-align:center;margin-bottom:48px}
    .logo{font-size:64px;margin-bottom:16px;filter:drop-shadow(0 0 30px rgba(255,107,107,0.3))}
    h1{font-size:42px;font-weight:700;background:linear-gradient(135deg,#fff 0%,#a0a0a0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
    .tagline{color:#666;font-size:15px;margin-top:8px;letter-spacing:2px}
    .search-card{background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
    .categories{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
    .cat{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:8px 16px;border-radius:20px;font-size:13px;color:#888;cursor:pointer;transition:all 0.3s ease}
    .cat:hover{background:rgba(255,107,107,0.15);border-color:rgba(255,107,107,0.3);color:#ff6b6b;transform:translateY(-2px)}
    .input-row{display:flex;gap:12px;margin-bottom:20px}
    input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:16px 20px;border-radius:12px;font-size:16px;color:#fff;transition:all 0.3s ease}
    input::placeholder{color:#555}
    input:focus{outline:none;border-color:rgba(255,107,107,0.5);box-shadow:0 0 20px rgba(255,107,107,0.1)}
    select{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:16px;border-radius:12px;font-size:14px;color:#fff;cursor:pointer;min-width:100px}
    select option{background:#1a1a1a;color:#fff}
    .btn-row{display:flex;gap:12px}
    button{flex:1;background:linear-gradient(135deg,#ff6b6b 0%,#ee5a5a 100%);border:none;padding:16px;border-radius:12px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;transition:all 0.3s ease;box-shadow:0 4px 20px rgba(255,107,107,0.3)}
    button:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,107,107,0.4)}
    .btn-locate{flex:0 0 auto;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:16px 20px;border-radius:12px;font-size:16px;color:#888;cursor:pointer;transition:all 0.3s ease}
    .btn-locate:hover{background:rgba(78,205,196,0.15);border-color:rgba(78,205,196,0.3);color:#4ecdc4}
    .btn-locate.active{background:rgba(78,205,196,0.2);border-color:rgba(78,205,196,0.5);color:#4ecdc4}
    .features{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
    .feat{text-align:center;padding:20px}
    .feat-icon{font-size:28px;margin-bottom:12px}
    .feat-title{font-size:13px;font-weight:500;color:#fff;margin-bottom:4px}
    .feat-desc{font-size:11px;color:#555}
    .footer{text-align:center;margin-top:48px;color:#333;font-size:12px}
    .location-status{text-align:center;font-size:12px;color:#4ecdc4;margin-top:12px;min-height:18px}
    @media(max-width:600px){.input-row{flex-direction:column}select{width:100%}.features{grid-template-columns:1fr}h1{font-size:32px}.btn-row{flex-direction:column}}
  </style>
</head>
<body>
<div class="bg"></div>
<div class="container">
  <div class="brand">
    <div class="logo">🎪</div>
    <h1>EventFinder</h1>
    <p class="tagline">DISCOVER EVENTS IN TAIWAN</p>
  </div>
  <div class="search-card">
    <form action="/search" method="get">
      <div class="categories">
        <span class="cat" onclick="setQuery('音樂 演唱會')">🎵 音樂</span>
        <span class="cat" onclick="setQuery('展覽 藝術')">🎨 展覽</span>
        <span class="cat" onclick="setQuery('市集 文創')">🛍️ 市集</span>
        <span class="cat" onclick="setQuery('戶外 露營')">⛺ 戶外</span>
        <span class="cat" onclick="setQuery('親子 兒童')">👶 親子</span>
      </div>
      <div class="input-row">
        <input id="q" name="query" placeholder="搜尋音樂會、展覽、市集..." autocomplete="off" />
        <select id="city" name="city">
          <option value="台北">台北</option>
          <option value="新北">新北</option>
          <option value="桃園">桃園</option>
          <option value="台中">台中</option>
          <option value="台南">台南</option>
          <option value="高雄">高雄</option>
          <option value="基隆">基隆</option>
          <option value="新竹">新竹</option>
          <option value="苗栗">苗栗</option>
          <option value="彰化">彰化</option>
          <option value="南投">南投</option>
          <option value="雲林">雲林</option>
          <option value="嘉義">嘉義</option>
          <option value="屏東">屏東</option>
          <option value="宜蘭">宜蘭</option>
          <option value="花蓮">花蓮</option>
          <option value="台東">台東</option>
        </select>
      </div>
      <div class="btn-row">
        <button type="button" class="btn-locate" id="locateBtn" onclick="getLocation()">📍</button>
        <button type="submit">探索活動</button>
      </div>
      <div class="location-status" id="locStatus"></div>
    </form>
  </div>
  <div class="features">
    <div class="feat">
      <div class="feat-icon">⚡</div>
      <div class="feat-title">即時更新</div>
      <div class="feat-desc">自動過濾過期活動</div>
    </div>
    <div class="feat">
      <div class="feat-icon">🎯</div>
      <div class="feat-title">精準排序</div>
      <div class="feat-desc">AI 智慧權重計算</div>
    </div>
    <div class="feat">
      <div class="feat-icon">📍</div>
      <div class="feat-title">在地優先</div>
      <div class="feat-desc">依你的位置排序</div>
    </div>
  </div>
  <div class="footer">Built with ❤️ for Taiwan</div>
</div>
<script>
function setQuery(t){document.getElementById('q').value=t}
function getLocation(){
  var btn=document.getElementById('locateBtn');
  var status=document.getElementById('locStatus');
  if(!navigator.geolocation){status.textContent='瀏覽器不支援定位';return;}
  status.textContent='定位中...';
  btn.classList.add('active');
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude;
    var lng=pos.coords.longitude;
    var city=detectCity(lat,lng);
    document.getElementById('city').value=city;
    status.textContent='已定位：'+city;
  },function(err){
    status.textContent='定位失敗：'+err.message;
    btn.classList.remove('active');
  });
}
function detectCity(lat,lng){
  if(lat>25.0&&lng>121.4&&lng<121.7) return '台北';
  if(lat>24.9&&lat<25.3&&lng>121.3&&lng<121.5) return '新北';
  if(lat>24.9&&lat<25.1&&lng>121.2&&lng<121.4) return '桃園';
  if(lat>24.0&&lat<24.3&&lng>120.5&&lng<120.8) return '台中';
  if(lat>22.9&&lat<23.1&&lng>120.1&&lng<120.3) return '台南';
  if(lat>22.5&&lat<22.8&&lng>120.2&&lng<120.4) return '高雄';
  if(lat>25.1&&lng>121.7) return '基隆';
  if(lat>24.7&&lat<24.9&&lng>120.9&&lng<121.1) return '新竹';
  if(lat>24.3&&lat<24.7&&lng>120.7&&lng<121.0) return '苗栗';
  if(lat>23.8&&lat<24.2&&lng>120.4&&lng<120.7) return '彰化';
  if(lat>23.8&&lat<24.1&&lng>120.6&&lng<121.0) return '南投';
  if(lat>23.5&&lat<23.9&&lng>120.1&&lng<120.6) return '雲林';
  if(lat>23.4&&lat<23.6&&lng>120.3&&lng<120.5) return '嘉義';
  if(lat>22.0&&lat<22.8&&lng>120.4&&lng<120.9) return '屏東';
  if(lat>24.4&&lat<24.8&&lng>121.5&&lng<121.9) return '宜蘭';
  if(lat>23.5&&lat<24.3&&lng>121.3&&lng<121.7) return '花蓮';
  if(lat>22.3&&lat<23.5&&lng>120.8&&lng<121.5) return '台東';
  return '台北';
}
</script>
</body>
</html>
